<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Player | Lire</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@400;500;700;800&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.469.0/font/lucide.min.css">

    <!-- Global Styles -->
    <link rel="stylesheet" href="/css/themes.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/responsive.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            overflow-x: hidden;
        }

        /* =========================
           PLAYER LAYOUT
        ========================== */

        .player-container {

            min-height: 100vh;

            padding-top: 130px;
            padding-bottom: 80px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .player-card {

            width: 100%;
            max-width: 1300px;

            display: grid;
            grid-template-columns: 420px 1fr;

            gap: 80px;

            align-items: center;
        }

        @media (max-width: 980px) {

            .player-card {
                grid-template-columns: 1fr;
                gap: 50px;
            }

            .doc-cover {
                max-width: 400px;
                margin: 0 auto;
            }

            .controls-pane {
                text-align: center;
            }

            .book-badge {
                margin-inline: auto;
            }

            .extra-controls {
                justify-content: center;
            }
        }

        /* =========================
           BOOK COVER
        ========================== */

        .doc-cover {

            width: 100%;
            aspect-ratio: 3 / 4;

            position: relative;

            overflow: hidden;

            border-radius: 36px;

            background:
                linear-gradient(135deg,
                    rgba(255, 255, 255, 0.08),
                    rgba(255, 255, 255, 0.03));

            border: 1px solid rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(30px);

            box-shadow:
                0 30px 100px rgba(0, 0, 0, 0.25);

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .doc-cover img {

            width: 82%;
            height: 82%;

            object-fit: cover;

            border-radius: 20px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .cover-overlay {

            position: absolute;

            bottom: 20px;
            left: 20px;
            right: 20px;
        }

        /* =========================
           RIGHT SIDE
        ========================== */

        .controls-pane {

            display: flex;
            flex-direction: column;

            gap: 38px;
        }

        .book-badge {

            width: fit-content;

            padding: 8px 16px;

            border-radius: 999px;

            background: rgba(255, 255, 255, 0.06);

            border: 1px solid rgba(255, 255, 255, 0.08);

            font-size: 13px;

            color: var(--text-secondary);
        }

        .book-title {

            margin-top: 18px;

            font-size: clamp(42px, 5vw, 74px);

            line-height: 0.95;

            max-width: 700px;
        }

        .book-meta {

            margin-top: 18px;

            font-size: 16px;

            color: var(--text-secondary);
        }

        /* =========================
           WAVEFORM
        ========================== */

        .waveform-container {

            width: 100%;
            height: 100px;

            display: flex;
            align-items: flex-end;

            gap: 4px;

            padding-top: 10px;
            padding-bottom: 10px;
        }

        .wave-bar {

            flex: 1;

            min-height: 10px;

            border-radius: 999px;

            background: rgba(255, 255, 255, 0.08);

            transition:
                height 0.18s ease,
                background 0.18s ease,
                transform 0.18s ease;
        }

        .wave-bar.active {

            background: var(--primary);

            transform: translateY(-2px);
        }

        /* =========================
           PLAYER PANEL
        ========================== */

        .player-panel {

            width: 100%;

            padding: 40px;

            border-radius: 36px;

            background:
                linear-gradient(135deg,
                    rgba(255, 255, 255, 0.08),
                    rgba(255, 255, 255, 0.03));

            border: 1px solid rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(20px);
        }

        /* =========================
           PROGRESS
        ========================== */

        .progress-section {
            width: 100%;
        }

        #progress-container {

            width: 100%;
            height: 10px;

            border-radius: 999px;

            background: rgba(255, 255, 255, 0.08);

            overflow: hidden;

            cursor: pointer;
        }

        #progress-fill {

            width: 0%;
            height: 100%;

            border-radius: inherit;

            background: var(--primary);

            transition: width 0.1s linear;
        }

        .progress-stats {

            display: flex;
            justify-content: space-between;

            margin-top: 12px;

            font-size: 13px;

            color: var(--text-secondary);
        }

        /* =========================
           MAIN CONTROLS
        ========================== */

        .playback-main {

            margin-top: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 28px;
        }

        .play-btn {

            width: 100px;
            height: 100px;

            border-radius: 50%;

            border: none;

            background: var(--primary);

            color: white;

            font-size: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;

            box-shadow:
                0 10px 50px rgba(0, 0, 0, 0.25);
        }

        .play-btn:hover {
            transform: scale(1.06);
        }

        .secondary-ctrl {

            width: 58px;
            height: 58px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.05);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;

            color: var(--text-secondary);

            transition: 0.2s ease;

            cursor: pointer;
        }

        .secondary-ctrl:hover {

            background: rgba(255, 255, 255, 0.1);

            color: var(--primary);
        }

        /* =========================
           EXTRA CONTROLS
        ========================== */

        .extra-controls {

            margin-top: 40px;

            display: flex;
            flex-wrap: wrap;

            gap: 16px;
        }

        .glass-control {

            padding: 14px 20px;

            border-radius: 20px;

            background: rgba(255, 255, 255, 0.05);

            border: 1px solid rgba(255, 255, 255, 0.08);

            display: flex;
            align-items: center;

            gap: 10px;

            color: var(--text-secondary);

            cursor: pointer;

            transition: 0.2s ease;
        }

        .glass-control:hover {

            background: rgba(255, 255, 255, 0.09);

            color: var(--primary);
        }

        /* =========================
           TRANSCRIPT
        ========================== */

        .transcription {

            padding: 28px;

            border-radius: 28px;

            background: rgba(255, 255, 255, 0.04);

            border: 1px solid rgba(255, 255, 255, 0.06);

            line-height: 1.8;

            color: var(--text-secondary);

            font-size: 15px;
        }
    </style>
</head>

<body>

    <!-- BACKGROUND -->
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <!-- HEADER -->
    <header>

        <div class="flex items-center gap-2">

            <a href="/index.html" class="flex items-center gap-2" style="text-decoration: none; color: inherit;">
                <i class="lucide-graphic-eq text-primary" style="font-size: 24px;"></i>

                <span style="
                        font-family: var(--font-display);
                        font-weight: 800;
                        font-size: 22px;
                        color: var(--primary);
                    ">
                    Lire
                </span>
            </a>
        </div>

        <nav class="flex gap-4 items-center">

            <button class="theme-toggle" id="theme-toggle">
                <i class="lucide-sun"></i>
            </button>

            <a href="/index.html" class="btn btn-outline">
                Exit Player
            </a>

        </nav>
    </header>

    <!-- MAIN -->
    <main class="container player-container">

        <div class="player-card animate-fade-in">

            <!-- LEFT -->
            <div class="doc-cover">

                <img id="cover-image"
                    src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?q=80&w=1200&auto=format&fit=crop"
                    alt="Book Cover" />

                <div class="cover-overlay glass-card">

                    <span class="badge">
                        AI Narration Active
                    </span>

                </div>
            </div>

            <!-- RIGHT -->
            <div class="controls-pane">

                <!-- TITLE -->
                <div>

                    <div class="book-badge">
                        AI Audiobook
                    </div>

                    <h1 class="book-title" id="playing-title">
                        Loading Book...
                    </h1>

                    <p class="book-meta" id="playing-meta">
                        Preparing your listening session
                    </p>

                </div>

                <!-- WAVEFORM -->
                <div class="waveform-container" id="waveform"></div>

                <!-- PLAYER PANEL -->
                <div class="player-panel">

                    <!-- PROGRESS -->
                    <div class="progress-section">

                        <div id="progress-container">
                            <div id="progress-fill"></div>
                        </div>

                        <div class="progress-stats">

                            <span id="current-time">
                                00:00
                            </span>

                            <span id="duration">
                                00:00
                            </span>

                        </div>
                    </div>

                    <!-- MAIN BUTTONS -->
                    <div class="playback-main">

                        <div class="secondary-ctrl" id="rewind">
                            <i class="lucide-rotate-ccw"></i>
                        </div>

                        <button class="play-btn" id="play-pause">
                            <i class="lucide-play" id="play-icon"></i>
                        </button>

                        <div class="secondary-ctrl" id="forward">
                            <i class="lucide-rotate-cw"></i>
                        </div>

                    </div>

                    <!-- EXTRA CONTROLS -->
                    <div class="extra-controls">

                        <div class="glass-control">

                            <i class="lucide-gauge"></i>

                            <span>
                                1.2x Speed
                            </span>

                        </div>

                        <div class="glass-control">

                            <i class="lucide-mic-2"></i>

                            <span>
                                Serene Voice
                            </span>

                        </div>

                    </div>

                </div>

                <!-- TRANSCRIPT -->
                <div class="transcription">

                    Waiting for document transcript...

                </div>

            </div>

        </div>

    </main>

    <!-- SCRIPTS -->
    <script type="module" src="/src/js/theme.ts"></script>
    <script type="module" src="/src/js/player.ts"></script>
    <script type="module" src="/src/js/animations.ts"></script>

</body>

</html>
